<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Al-Himma — Абу Сальма: сайты, Telegram-боты, Mini Apps и веб-сервисы</title>
  <meta name="description" content="Al-Himma — разработка сайтов, Telegram-ботов обратной связи, Telegram Mini Apps и веб-сервисов. Сайт — за 3–7 дней, бот — за 1 день.">
  <meta name="theme-color" content="#F4F0EA">

    (function () {
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) document.documentElement.classList.add('anim');
    })();
  </script>

  <!-- все шрифты и маски логотипа грузим сразу и вместе: иначе браузер находит их по одному
       и после каждого заново раскладывает всю страницу -->
  <link rel="preload" href="assets/fonts/geologica-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/geologica-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/geologica-rub.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/oswald-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrainsmono-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/brand/himma-ar.svg" as="image" crossorigin>
  <link rel="preload" href="assets/brand/himma-mark.svg" as="image" crossorigin>

  <link rel="preload" as="image" href="assets/brand/glass-word@1x.webp" imagesrcset="assets/brand/glass-word@1x.webp 1x, assets/brand/glass-word@2x.webp 2x" media="(min-width: 1000px)">
  <link rel="preload" as="image" href="assets/brand/glass-mark@1x.webp" imagesrcset="assets/brand/glass-mark@1x.webp 1x, assets/brand/glass-mark@2x.webp 2x" media="(min-width: 1000px)">

</head>
<body>
  <a class="skip" href="#main" data-i18n="ui.skip">К содержимому</a>

  <!-- ============ ШАПКА ============ -->
  <header class="header" id="top">
    <div class="header__bar container">
      <a class="brand" href="#hero" aria-label="Al-Himma">
        <svg class="brand__mark" aria-hidden="true"><use href="#i-mark"/></svg>
        <span class="brand__name" data-i18n="brand.name">Al-Himma</span>
      </a>

      <nav class="nav" id="nav" data-i18n-attr="aria-label:ui.navLabel" aria-label="Основная навигация">
        <ul class="nav__list" data-render="nav"></ul>
      </nav>

      <div class="header__tools">
        <div class="lang" role="group" data-i18n-attr="aria-label:ui.langLabel" aria-label="Язык сайта">
          <button type="button" class="lang__btn" data-lang="ru" aria-pressed="true">RU</button>
          <button type="button" class="lang__btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="btn btn--ink btn--sm header__wa" data-wa href="#contacts" data-i18n-attr="aria-label:ui.waAria" aria-label="Написать в WhatsApp" target="_blank" rel="noopener">
          <svg class="ico" aria-hidden="true"><use href="#i-wa"/></svg>
          <span data-i18n="ui.wa">WhatsApp</span>
        </a>
        <button type="button" class="burger" id="burger" aria-expanded="false" aria-controls="nav" data-i18n-attr="aria-label:ui.menu" aria-label="Меню">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- ============ HERO ============ -->
    <!-- Первый экран в духе обложки «PORTFOLIO»: на белом глянце огромный логотип «الهمة»,
         снизу слева — имя и кнопки, справа — чем занимаюсь. -->
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <h1 class="visually-hidden" id="hero-title" data-i18n="hero.title"></h1>
      <!-- обёртка двигается при прокрутке отдельным слоем, а логотип с тенями внутри не перерисовывается -->
      <div class="hero__float" aria-hidden="true">
        <!-- подъём слова из-под линии (__wordbox) и блик (__shine) двигаются только через transform.
             Блик лежит отдельной копией логотипа поверх, без теней: иначе 6 теней-фильтров
             пересчитывались бы в каждом кадре его пробега -->
        <div class="hero__logo hero__logo--glass">
          <span class="hero__mark"></span>
          <span class="hero__wordbox"><span class="hero__word"></span></span>
        </div>
        <div class="hero__logo hero__logo--gloss">
          <span class="hero__mark"><span class="hero__shine"></span></span>
          <span class="hero__wordbox"><span class="hero__word"><span class="hero__shine"></span></span></span>
        </div>
      </div>
      <div class="container hero__info">
        <div class="hero__hello">
          <p class="hero__name" data-i18n="brand.owner"></p>
          <div class="hero__cta">
            <a class="btn btn--ink btn--lg" href="#cases">
              <span data-i18n="hero.ctaWorks"></span>
            </a>
            <a class="btn btn--accent btn--lg" data-wa href="#contacts" target="_blank" rel="noopener">
              <svg class="ico" aria-hidden="true"><use href="#i-wa"/></svg>
              <span data-i18n="hero.ctaOrder"></span>
            </a>
          </div>
        </div>
        <div class="hero__role">
          <p class="hero__job" data-i18n="hero.role"></p>
          <ul class="hero__list" data-render="heroPoints"></ul>
        </div>
      </div>
    </section>

    <!-- ============ УСЛУГИ ============ -->
    <section class="section" id="services" aria-labelledby="services-title">
      <div class="container">
        <header class="section__head">
          <h2 class="h2" id="services-title" data-i18n="services.title"></h2>
          <p class="lead" data-i18n="services.lead"></p>
        </header>
        <ul class="services" data-render="services"></ul>
      </div>
    </section>

    <!-- ============ РАБОТЫ ============ -->
    <section class="section section--tint" id="cases" aria-labelledby="cases-title">
      <div class="container">
        <header class="section__head">
          <h2 class="h2" id="cases-title" data-i18n="cases.title"></h2>
          <p class="lead" data-i18n="cases.lead"></p>
        </header>
        <ul class="cases" data-render="cases"></ul>
      </div>
    </section>

    <!-- ============ ПРОЦЕСС ============ -->
    <section class="section" id="process" aria-labelledby="process-title">
      <div class="container">
        <header class="section__head">
          <h2 class="h2" id="process-title" data-i18n="process.title"></h2>
          <p class="lead lead--strong" data-i18n="process.lead"></p>
        </header>
        <ol class="steps" data-render="process"></ol>
      </div>
    </section>

    <!-- ============ ЦЕНЫ ============ -->
    <section class="section section--tint" id="pricing" aria-labelledby="pricing-title">
      <div class="container pricing">
        <header class="pricing__head">
          <h2 class="h2" id="pricing-title" data-i18n="pricing.title"></h2>
          <p class="lead" data-i18n="pricing.lead"></p>
          <a class="btn btn--accent btn--lg pricing__cta" data-wa href="#contacts" target="_blank" rel="noopener">
            <svg class="ico" aria-hidden="true"><use href="#i-wa"/></svg>
            <span data-i18n="pricing.cta"></span>
          </a>
          <p class="pricing__note" data-i18n="pricing.note"></p>
        </header>
        <ul class="prices" data-render="pricing"></ul>
      </div>
    </section>

    <!-- ============ ОТЗЫВЫ ============ -->
    <section class="section" id="reviews" aria-labelledby="reviews-title">
      <div class="container">
        <header class="section__head">
          <h2 class="h2" id="reviews-title" data-i18n="reviews.title"></h2>
          <p class="lead" data-i18n="reviews.lead"></p>
        </header>
        <ul class="reviews" id="reviews-list"></ul>
        <p class="reviews__empty" id="reviews-empty" hidden></p>

        <form class="rform" id="review-form" novalidate>
          <h3 class="h3 rform__title" data-i18n="reviews.form.title"></h3>
          <div class="rform__grid">
            <label class="field">
              <span class="field__label" data-i18n="reviews.form.name"></span>
              <input class="field__input" type="text" name="name" maxlength="40" autocomplete="name" required>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="reviews.form.role"></span>
              <input class="field__input" type="text" name="role" maxlength="60" data-i18n-attr="placeholder:reviews.form.rolePh">
            </label>
          </div>
          <fieldset class="rate">
            <legend class="field__label" data-i18n="reviews.form.rating"></legend>
            <div class="rate__stars" id="rate-stars"></div>
          </fieldset>
          <label class="field">
            <span class="field__label" data-i18n="reviews.form.text"></span>
            <textarea class="field__input field__input--area" name="text" rows="4" maxlength="500" required data-i18n-attr="placeholder:reviews.form.textPh"></textarea>
          </label>
          <!-- ловушка для ботов: люди это поле не видят -->
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="rform__foot">
            <button class="btn btn--ink btn--lg" type="submit" id="review-submit"><span data-i18n="reviews.form.submit"></span></button>
            <p class="rform__note" data-i18n="reviews.form.note"></p>
          </div>
          <p class="rform__status" id="review-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- ============ ВОПРОСЫ ============ -->
    <section class="section section--tint" id="faq" aria-labelledby="faq-title">
      <div class="container faq__wrap">
        <header class="section__head">
          <h2 class="h2" id="faq-title" data-i18n="faq.title"></h2>
        </header>
        <div class="faq" data-render="faq"></div>
      </div>
    </section>

    <!-- ============ КОНТАКТЫ ============ -->
    <section class="contacts" id="contacts" aria-labelledby="contacts-title">
      <div class="contacts__flood" aria-hidden="true"></div>
      <div class="container contacts__grid">
        <div class="contacts__text">
          <h2 class="contacts__title" id="contacts-title" data-i18n="contacts.title"></h2>
          <p class="contacts__lead" data-i18n="contacts.text"></p>
        </div>
        <ul class="clinks">
          <li>
            <a class="clink" data-wa href="#" target="_blank" rel="noopener">
              <span class="clink__label"><svg class="ico" aria-hidden="true"><use href="#i-wa"/></svg><span data-i18n="contacts.waLabel"></span></span>
              <span class="clink__value" data-phone-text></span>
            </a>
          </li>
          <li>
            <a class="clink" data-tg href="#" target="_blank" rel="noopener">
              <span class="clink__label"><svg class="ico" aria-hidden="true"><use href="#i-plane"/></svg><span data-i18n="contacts.tgLabel"></span></span>
              <span class="clink__value" data-tg-text></span>
            </a>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year">2026</span> <span data-i18n="brand.name"></span>, <span data-i18n="brand.owner"></span>. <span data-i18n="footer.rights"></span></p>
    </div>
  </footer>

  <noscript><p style="padding:24px;text-align:center">Для работы сайта нужен JavaScript. / This site needs JavaScript.</p></noscript>
